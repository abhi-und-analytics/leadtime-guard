[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadtime-guard"
version = "1.0.0"
description = "AI agent that flags late long-lead equipment on data-centre builds (synthetic data, human approval)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
